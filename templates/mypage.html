<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 위클리 다이어리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Pretendard and Nanum Pen Script -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cottage: {
                            bg: '#F6F4EE',       /* Warm oat / soft cream background */
                            card: '#FFFDF9',     /* Paper white */
                            primary: '#556B2F',  /* Olive / Moss Green */
                            secondary: '#D2B48C',/* Tan / Warm Wood */
                            accent: '#BC8F8F',   /* Rosy brown / Dried flower */
                            sage: '#E3E8DC',     /* Soft Sage green */
                            brown: '#4A3B32',    /* Earthy dark brown text */
                            muted: '#8C7A70'     /* Muted taupe */
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        handwriting: ['Nanum Pen Script', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #F6F4EE;
            color: #4A3B32;
            overflow-x: hidden;
        }
        /* Custom scrollbar for Cottagecore aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #E3E8DC;
        }
        ::-webkit-scrollbar-thumb {
            background: #556B2F;
            border-radius: 4px;
        }
        .glass-panel {
            background: rgba(255, 253, 249, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(85, 107, 47, 0.15);
        }
        .diary-shadow {
            box-shadow: 0 10px 30px -5px rgba(74, 59, 50, 0.08);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-cottage-bg text-cottage-brown min-h-screen flex flex-col justify-between selection:bg-cottage-sage selection:text-cottage-brown">

    <!-- 상단 네비게이션바 (Navigation Bar) -->
    <header class="sticky top-0 z-50 glass-panel border-b border-cottage-sage/60 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- 로고 및 사이트 이름 -->
            <a href="/" class="flex items-center space-x-3 group">
                <div class="relative w-12 h-12 rounded-2xl bg-gradient-to-tr from-cottage-primary to-cottage-secondary flex items-center justify-center text-white shadow-md transform group-hover:rotate-6 transition duration-300">
                    <!-- 코티지 곰돌이 캐릭터 아이콘 SVG -->
                    <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
                        <circle cx="12" cy="13" r="7" fill="#D2B48C"/>
                        <circle cx="7" cy="7" r="3.5" fill="#D2B48C"/>
                        <circle cx="17" cy="7" r="3.5" fill="#D2B48C"/>
                        <circle cx="9.5" cy="12" r="1" fill="#4A3B32"/>
                        <circle cx="14.5" cy="12" r="1" fill="#4A3B32"/>
                        <ellipse cx="12" cy="14" rx="1.5" ry="1" fill="#4A3B32"/>
                        <path d="M11 16.5 C11 16.5, 12 17.5, 13 16.5" stroke="#4A3B32" stroke-width="1" stroke-linecap="round" fill="none"/>
                    </svg>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-cottage-primary rounded-full flex items-center justify-center text-[10px] text-white">🌿</div>
                </div>
                <div>
                    <span class="text-2xl font-bold tracking-tight text-cottage-brown">위클리 다이어리</span>
                    <span class="block text-xs text-cottage-muted font-medium">포근한 코티지 감성 힐링 공간</span>
                </div>
            </a>

            <!-- 홈으로 가기 버튼 -->
            <a href="/" class="px-4 py-2 text-sm font-semibold rounded-xl bg-white border border-cottage-primary/30 text-cottage-primary hover:bg-cottage-primary hover:text-white transition shadow-xs flex items-center space-x-1.5">
                <i class="fa-solid fa-house"></i>
                <span>홈으로</span>
            </a>
        </div>
    </header>

    <!-- 메인 마이페이지 영역 -->
    <main class="flex-grow flex items-center justify-center py-16 px-4 sm:px-6 relative overflow-hidden">
        <!-- 배경 데코 블러 효과 -->
        <div class="absolute -top-12 -left-12 w-80 h-80 rounded-full bg-cottage-sage/30 blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-0 -right-12 w-80 h-80 rounded-full bg-cottage-secondary/20 blur-3xl pointer-events-none"></div>

        <div class="max-w-md w-full relative z-10">
            <!-- 코티지 감성 마이페이지 카드 패널 -->
            <div class="glass-panel p-8 sm:p-10 rounded-3xl diary-shadow border border-cottage-sage space-y-6 text-center">
                
                <!-- 곰돌이 캐릭터 마스코트 배지 -->
                <div class="inline-flex items-center space-x-2 bg-cottage-sage px-3.5 py-1.5 rounded-full text-cottage-primary text-xs font-semibold mb-1 animate-float">
                    <i class="fa-solid fa-seedling"></i>
                    <span>포근이의 숲속 오두막</span>
                </div>

                <!-- 환영 메시지 (Flask 템플릿 변수 {{ name }} 유지) -->
                <div class="space-y-3">
                    <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-cottage-primary to-cottage-secondary flex items-center justify-center text-white text-3xl mx-auto shadow-md">
                        <svg class="w-12 h-12 fill-current" viewBox="0 0 24 24">
                            <circle cx="12" cy="13" r="7" fill="#D2B48C"/>
                            <circle cx="7" cy="7" r="3.5" fill="#D2B48C"/>
                            <circle cx="17" cy="7" r="3.5" fill="#D2B48C"/>
                            <circle cx="9.5" cy="12" r="1" fill="#4A3B32"/>
                            <circle cx="14.5" cy="12" r="1" fill="#4A3B32"/>
                            <ellipse cx="12" cy="14" rx="1.5" ry="1" fill="#4A3B32"/>
                            <path d="M11 16.5 C11 16.5, 12 17.5, 13 16.5" stroke="#4A3B32" stroke-width="1" stroke-linecap="round" fill="none"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-cottage-brown">
                        {{ name }}님 환영합니다! ☕
                    </h1>
                    <p class="text-xs sm:text-sm text-cottage-muted leading-relaxed">
                        로그인이 정상적으로 완료되었습니다.<br>포근한 숲속 오두막에서 오늘의 일기를 이어가세요.
                    </p>
                </div>

                <!-- 프로필 정보 요약 박스 -->
                <div class="bg-cottage-bg p-4 rounded-2xl border border-dashed border-cottage-primary/40 text-left space-y-2">
                    <div class="flex items-center justify-between text-xs text-cottage-brown font-medium">
                        <span class="flex items-center"><i class="fa-solid fa-user-shield text-cottage-primary mr-1.5"></i> 계정 상태</span>
                        <span class="text-cottage-primary font-bold">정상 인증됨 🌿</span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-cottage-brown font-medium">
                        <span class="flex items-center"><i class="fa-solid fa-book-journal-whills text-cottage-primary mr-1.5"></i> 나의 감정 기록</span>
                        <span class="text-stone-700">위클리 저널 연동 중</span>
                    </div>
                </div>

                <!-- 기존 Flask 로그아웃 링크 버튼 (경로 유지) -->
                <div class="pt-2">
                    <a href="/logout" 
                        class="w-full py-4 rounded-2xl bg-cottage-primary text-white font-bold shadow-lg shadow-cottage-primary/30 hover:bg-opacity-90 transition text-base flex items-center justify-center space-x-2 transform hover:-translate-y-0.5">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>로그아웃</span>
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-cottage-brown text-stone-300 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs space-y-1">
            <p class="text-white font-semibold">위클리 다이어리 · Cottagecore Edition</p>
            <p class="text-stone-400">© 2026 Weekly Diary. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
